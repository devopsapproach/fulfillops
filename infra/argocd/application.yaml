apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fulfillops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/devopsapproach/fulfillops.git
    targetRevision: feat/t19-ci-acceptance
    path: infra/k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: fulfillops-lab

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
