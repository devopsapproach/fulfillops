name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: fulfillops_test
          POSTGRES_PASSWORD: CHANGE_ME
          POSTGRES_DB: fulfillops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fulfillops_test -d fulfillops_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 8080
      DATABASE_URL: postgresql://fulfillops_test:CHANGE_ME@localhost:5432/fulfillops_test
      TEST_DATABASE_URL: postgresql://fulfillops_test:CHANGE_ME@localhost:5432/fulfillops_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply test database migrations
        run: npm run db:migrate:deploy

      - name: Run database integration tests
        run: npm run test:integration

      - name: Run static checks, unit tests, and TypeScript build
        run: npm run check

      - name: Build multistage Docker image with immutable SHA tag
        run: docker build --tag fulfillops:${{ github.sha }} .

      - name: Verify container runs as non-root user (WP5 gate)
        run: |
          CONTAINER_UID=$(docker run --rm --entrypoint id fulfillops:${{ github.sha }} -u)
          echo "Container UID: ${CONTAINER_UID}"
          if [ "${CONTAINER_UID}" -eq 0 ]; then
            echo "Error: Container is running as root (UID 0)"
            exit 1
          fi
