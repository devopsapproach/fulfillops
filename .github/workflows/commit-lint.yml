name: commit linting

on:
  push:

  pull_request:

permissions:
  # The workflow only needs read access to repository contents.
  contents: read

jobs:
  commitlint:
    # Run the job on the latest Ubuntu GitHub-hosted runner.
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository so that the workflow can access
      # the source code, package.json, commitlint configuration, etc.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the complete Git history.
          #
          # This is important because commitlint needs to inspect
          # commits between two SHAs (--from and --to).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

          # Enable npm dependency caching to make subsequent workflow
          # runs faster.
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On a push event, validate the commits that were introduced
      # by this push.
      - name: Validate pushed commits
        if: github.event_name == 'push'
        run: |
          # Check all commits between the previous revision and
          # the new revision.
          #
          # github.event.before = commit SHA before the push
          # github.event.after  = commit SHA after the push
          #
          # --verbose displays detailed commitlint output.
          npx commitlint \
            --from "${{ github.event.before }}" \
            --to "${{ github.event.after }}" \
            --verbose

      # On a Pull Request event, validate the commits that are part
      # of the PR compared with the target branch.
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          # Check commits between the PR's base commit and head commit.
          #
          # base.sha = the commit where the PR branches from
          # head.sha = the latest commit in the PR
          #
          # This ensures all commits introduced by the PR follow
          # the commitlint rules.
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
